name: News Bot
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      reconcile_id:
        description: 'ID opcional de noticia bloqueada en bot-state a reconciliar'
        required: false
        default: ''
      reconcile_action:
        description: 'Accion de reconciliacion (none, mark_sent, retry, drop)'
        required: false
        default: 'none'

permissions: {}

# Serialize publishers; the durable outbox also protects each send with a CAS claim.
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip_audit: true

  run-bot:
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.txt'

      - name: Reconcile stuck outbox item (optional)
        if: ${{ inputs.reconcile_id != '' && inputs.reconcile_action != '' && inputs.reconcile_action != 'none' }}
        env:
          PYTHON_DOTENV_DISABLED: '1'
          GIT_TOKEN:              ${{ secrets.GIT_TOKEN || secrets.GH_PAT }}
          RECONCILE_ID:           ${{ inputs.reconcile_id }}
          RECONCILE_ACTION:       ${{ inputs.reconcile_action }}
        run: python tools/reconcile_outbox.py --id "$RECONCILE_ID" --action "$RECONCILE_ACTION"

      - name: Run bot
        env:
          PYTHON_DOTENV_DISABLED:  '1'
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_ACCESS_KEY:     ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:          ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:          ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEYS:           ${{ secrets.GROQ_API_KEYS }}
          GROQ_MODEL:              ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          GROQ_FALLBACK_MODEL:     ${{ vars.GROQ_FALLBACK_MODEL || secrets.GROQ_FALLBACK_MODEL || 'openai/gpt-oss-20b' }}
          NVIDIA_API_KEY:          ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL:            ${{ vars.NVIDIA_MODEL || secrets.NVIDIA_MODEL || 'meta/llama-3.2-11b-vision-instruct' }}
          GIT_TOKEN:               ${{ secrets.GIT_TOKEN || secrets.GH_PAT }}

          NVD_API_KEY:             ${{ secrets.NVD_API_KEY }}
          GREYNOISE_API_KEY:       ${{ secrets.GREYNOISE_API_KEY }}
        run: python run_job.py

